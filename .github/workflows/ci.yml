name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Validate the API configuration for the push branch or PR target.
      APP_ENV: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'production' || 'development' }}
      API_INTERNAL_URL: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'https://api.newdok.store' || 'https://api-dev.newdok.store' }}
      NEXT_PUBLIC_SITE_URL: https://ci.newdok.invalid
      ALLOW_INDEXING: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
